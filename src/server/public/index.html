<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar — testing UI</title>
<style>
  :root {
    --bg: #0d0f12;
    --panel: #14171c;
    --panel-2: #1a1e24;
    --line: #262b33;
    --text: #e4e7ec;
    --dim: #8b94a3;
    --faint: #5a6373;
    --accent: #6ea8fe;
    --investor: #7dd3fc;
    --founder: #e4e7ec;
    --red: #f87171;
    --amber: #fbbf24;
    --green: #4ade80;
    --purple: #c084fc;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }

  header {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 18px; border-bottom: 1px solid var(--line);
    background: var(--panel); flex: none;
  }
  .brand { font-weight: 650; letter-spacing: .18em; font-size: 12px; }
  .brand span { color: var(--faint); font-weight: 400; letter-spacing: .04em; margin-left: 10px; }
  header .spacer { flex: 1; }

  select, button, textarea {
    font: inherit; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px;
  }
  select { max-width: 340px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: #08111f; border-color: var(--accent); font-weight: 600; }

  main { flex: 1; display: grid; grid-template-columns: minmax(0,1fr) 400px; min-height: 0; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } aside { display: none; } }

  /* ── conversation ── */
  .conv { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  .scroll { flex: 1; overflow-y: auto; padding: 22px 26px; }
  .turn { margin-bottom: 20px; max-width: 62ch; }
  .turn .who {
    font: 600 10px/1 var(--mono); letter-spacing: .13em; text-transform: uppercase;
    color: var(--faint); margin-bottom: 6px; display: flex; gap: 8px; align-items: center;
  }
  .turn.investor .who { color: var(--investor); }
  .turn.investor .body { color: var(--investor); }
  .turn.founder { margin-left: auto; }
  .turn.founder .body {
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 13px;
  }
  .body { white-space: pre-wrap; }

  .tag {
    font: 600 9px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase;
    padding: 3px 6px; border-radius: 4px; border: 1px solid currentColor;
  }
  .tag.contradiction { color: var(--red); }
  .tag.derail        { color: var(--purple); }
  .tag.follow_up     { color: var(--amber); }
  .tag.spine         { color: var(--accent); }
  .tag.wrap_up       { color: var(--faint); }

  .annot { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: 500 10px/1.5 var(--mono); padding: 2px 7px; border-radius: 4px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--dim);
  }
  .chip.good { color: var(--green); border-color: #1e4030; }
  .chip.warn { color: var(--amber); border-color: #453413; }
  .chip.bad  { color: var(--red);   border-color: #4a2020; }
  .chip.claim { color: var(--accent); border-color: #1e3352; }

  .composer { border-top: 1px solid var(--line); padding: 14px 26px; background: var(--panel); flex: none; }
  .composer .row { display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; resize: none; min-height: 62px; max-height: 200px; line-height: 1.5; }
  .hint { font: 10px/1 var(--mono); color: var(--faint); margin-top: 7px; letter-spacing: .04em; }

  /* ── instrument panel ── */
  aside { overflow-y: auto; background: var(--panel); }
  section { border-bottom: 1px solid var(--line); padding: 15px 18px; }
  h2 {
    font: 600 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
    color: var(--faint); margin: 0 0 11px;
  }
  .kv { display: flex; justify-content: space-between; gap: 12px; font: 12px/1.9 var(--mono); }
  .kv .k { color: var(--dim); }
  .kv .v { color: var(--text); }
  .kv .v.bad { color: var(--red); } .kv .v.warn { color: var(--amber); } .kv .v.good { color: var(--green); }

  .who-card { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 10px; }
  .who-card img { width: 52px; height: 52px; border-radius: 50%; flex: none; border: 1px solid var(--line); }
  .who-card .nm { font-weight: 650; font-size: 15px; line-height: 1.25; }
  .who-card .rl { font-size: 11.5px; color: var(--dim); line-height: 1.4; margin-top: 2px; }
  .disclaimer {
    font-size: 10.5px; line-height: 1.45; color: var(--faint);
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 5px; padding: 6px 8px; margin-top: 10px;
  }
  .turn .face { width: 22px; height: 22px; border-radius: 50%; vertical-align: middle; }
  .profile-kind {
    display: inline-block; font: 600 9px/1 var(--mono); letter-spacing: .1em;
    text-transform: uppercase; padding: 3px 6px; border-radius: 4px; margin-bottom: 8px;
  }
  .profile-kind.synthetic { color: var(--accent);  background: #12203a; }
  .profile-kind.derived   { color: var(--green);   background: #122b1e; }
  .profile-kind.character { color: var(--purple);  background: #251a38; }
  .prov { font-size: 11px; color: var(--faint); line-height: 1.5; margin-top: 8px; font-style: italic; }

  .dial { display: grid; grid-template-columns: 74px 1fr 30px; gap: 8px; align-items: center; margin-bottom: 5px; }
  .dial .name { font: 10px/1 var(--mono); color: var(--dim); letter-spacing: .04em; }
  .bar { height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .dial .num { font: 10px/1 var(--mono); color: var(--faint); text-align: right; }

  .spine li { list-style: none; display: flex; gap: 8px; align-items: baseline; font-size: 12px; padding: 2px 0; }
  .spine ul { margin: 0; padding: 0; }
  .mark { font: 700 11px/1.4 var(--mono); width: 12px; flex: none; }
  .s-satisfied .mark { color: var(--green); }
  .s-dodged    .mark { color: var(--red); }
  .s-asking    .mark { color: var(--amber); }
  .s-unasked   { color: var(--faint); }
  .s-unasked .mark { color: var(--faint); }
  .s-dodged .label { color: var(--red); }

  .finding { border-left: 2px solid var(--line); padding: 2px 0 2px 10px; margin-bottom: 11px; }
  .finding.high   { border-color: var(--red); }
  .finding.medium { border-color: var(--amber); }
  .finding.low    { border-color: var(--faint); }
  .finding .sum { font-size: 12px; line-height: 1.45; }
  .finding .probe { font-size: 11px; color: var(--faint); font-style: italic; margin-top: 4px; line-height: 1.45; }

  table.ledger { width: 100%; border-collapse: collapse; font: 11px/1.6 var(--mono); }
  table.ledger td { padding: 2px 0; vertical-align: top; }
  table.ledger td.m { color: var(--dim); padding-right: 8px; }
  table.ledger td.v { color: var(--text); text-align: right; white-space: nowrap; }

  .empty { color: var(--faint); font-size: 12px; font-style: italic; }

  /* ── voice ── */
  #voice.live, #demo.live { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
  .voicebar {
    display: none; align-items: center; gap: 14px;
    padding: 12px 26px; border-top: 1px solid var(--line); background: var(--panel);
  }
  .voicebar.on { display: flex; }
  .orb {
    width: 12px; height: 12px; border-radius: 50%; background: var(--faint); flex: none;
    transition: background .15s, box-shadow .15s;
  }
  .orb.listening { background: var(--green); box-shadow: 0 0 0 5px rgba(74,222,128,.14); }
  .orb.speaking  { background: var(--investor); box-shadow: 0 0 0 5px rgba(125,211,252,.16); }
  .vstatus { font: 11px/1 var(--mono); color: var(--dim); letter-spacing: .05em; }
  .live-cap { color: var(--faint); font-style: italic; font-size: 13px; }

  /* ── pre-read + delta ── */
  .posture {
    display: inline-block; font: 700 10px/1 var(--mono); letter-spacing: .1em;
    text-transform: uppercase; padding: 4px 8px; border-radius: 4px;
  }
  .posture.leaning_in         { color: var(--green);  background: #122b1c; }
  .posture.neutral            { color: var(--dim);    background: #1e232b; }
  .posture.skeptical          { color: var(--amber);  background: #322610; }
  .posture.looking_for_the_no { color: var(--red);    background: #351717; }

  .oneliner { font-size: 12px; line-height: 1.5; margin: 4px 0 10px; }
  .oneliner .lab { font: 10px/1 var(--mono); color: var(--faint); letter-spacing: .06em; }
  .oneliner .q { color: var(--text); font-style: italic; }

  .flag { display: flex; gap: 8px; font-size: 12px; line-height: 1.45; margin-bottom: 9px; }
  .flag .n { color: var(--red); font: 700 11px/1.5 var(--mono); flex: none; }

  .nocase {
    font-size: 12px; line-height: 1.55; color: var(--amber);
    background: #241c0c; border-left: 2px solid var(--amber);
    padding: 9px 11px; border-radius: 0 5px 5px 0;
  }

  .probe { font-size: 12px; line-height: 1.45; margin-bottom: 9px; display: flex; gap: 8px; }
  .probe .mk { flex: none; font: 700 11px/1.5 var(--mono); }
  .probe.satisfied .mk { color: var(--green); }
  .probe.dodged    .mk { color: var(--red); }
  .probe.unasked   .mk { color: var(--faint); }
  .probe .qt { color: var(--dim); font-style: italic; }

  .dim-row { display: flex; gap: 8px; align-items: baseline; font-size: 12px; margin-bottom: 8px; }
  .dot { font-size: 11px; }
  .dot.concern { color: var(--red); } .dot.neutral { color: var(--faint); } .dot.strength { color: var(--green); }
  .dim-row .what { color: var(--faint); font-size: 11px; line-height: 1.45; }

  .uploader { display: flex; gap: 8px; align-items: center; }
  .uploader label {
    font-size: 12px; color: var(--dim); cursor: pointer;
    border: 1px dashed var(--line); border-radius: 6px; padding: 6px 11px;
  }
  .uploader label:hover { border-color: var(--accent); color: var(--text); }
  .uploader .name { font: 11px/1 var(--mono); color: var(--green); }
  #briefbtn.on { border-color: var(--green); color: var(--green); }
  .obj { border-left: 2px solid var(--line); padding: 2px 0 2px 10px; margin-bottom: 12px; }
  .obj .th { font-size: 12px; font-weight: 600; line-height: 1.4; }
  .obj .q { font-size: 11px; color: var(--dim); font-style: italic; margin-top: 4px; line-height: 1.45; }
  .obj .src { font-size: 10px; margin-top: 4px; }
  .obj .src a { color: var(--faint); text-decoration: none; }
  .obj .src a:hover { color: var(--accent); }
  .err { color: var(--red); font-size: 12px; padding: 8px 26px; }
  .spinner { display: inline-block; width: 9px; color: var(--faint); font-family: var(--mono); }
</style>
</head>
<body>

<header>
  <div class="brand">RADAR <span>seed pitch practice · testing UI</span></div>
  <div class="spacer"></div>
  <div class="uploader">
    <label for="deck" id="decklabel">+ deck</label>
    <input type="file" id="deck" accept=".pdf,.pptx,.ppt,.png,.jpg,.jpeg" hidden>
    <button id="sample" title="Load the planted-flaw fixture deck">sample deck</button>
    <button id="briefbtn" title="Load a category brief mined from X">+ market</button>
    <span class="name" id="deckname"></span>
  </div>
  <select id="profile"></select>
  <button id="start" class="primary">New session</button>
  <button id="voice">🎙 Voice</button>
  <button id="demo" title="Two AI agents pitch each other — generates a demo script">▶ Auto demo</button>
  <button id="debrief" disabled>Debrief</button>
  <button id="export" disabled>Export</button>
</header>

<main>
  <div class="conv">
    <div class="scroll" id="scroll">
      <p class="empty" style="padding:40px 0;text-align:center">
        Pick an investor and start a session.
      </p>
    </div>
    <div id="error" class="err" hidden></div>
    <div class="voicebar" id="voicebar">
      <span class="orb" id="orb"></span>
      <span class="vstatus" id="vstatus">idle</span>
      <span class="spacer" style="flex:1"></span>
      <button id="barge">Interrupt</button>
      <button id="endvoice">End</button>
    </div>
    <div class="composer" id="composer">
      <div class="row">
        <textarea id="answer" placeholder="Your answer…" disabled></textarea>
        <button id="send" disabled>Send</button>
      </div>
      <div class="hint">⌘/ctrl + enter to send</div>
    </div>
  </div>

  <aside id="panel"></aside>
</main>

<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (n) => `${Math.round((n ?? 0) * 100)}%`;

let sessionId = null;
let busy = false;
let memoId = null;
let briefId = null;
let memo = null;
let delta = null;
let probeOutcomes = null;

// ── profiles ────────────────────────────────────────────────────────────────
const KIND_ORDER = { synthetic: 0, derived: 1, character: 2 };
const KIND_LABEL = {
  synthetic: 'Composite archetypes',
  derived: 'Derived from public behaviour',
  character: 'Unserious — trains room control',
};

const { profiles } = await (await fetch('/api/profiles')).json();
profiles.sort((a, b) => KIND_ORDER[a.kind] - KIND_ORDER[b.kind]);
for (const kind of ['synthetic', 'derived', 'character']) {
  const group = document.createElement('optgroup');
  group.label = KIND_LABEL[kind];
  for (const p of profiles.filter((x) => x.kind === kind)) {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.persona ? `${p.persona.fullName} — ${p.persona.firm}` : p.name;
    group.appendChild(opt);
  }
  $('profile').appendChild(group);
}
$('profile').value = 'seed_skeptic';

// ── networking ──────────────────────────────────────────────────────────────
function setBusy(on) {
  busy = on;
  $('send').disabled = on || !sessionId;
  $('answer').disabled = on || !sessionId;
  $('start').disabled = on;
  if (!on && sessionId) $('answer').focus();
}

function showError(message) {
  const el = $('error');
  el.hidden = !message;
  el.textContent = message ?? '';
}

async function call(url, options) {
  const res = await fetch(url, options);
  const body = await res.json();
  if (!res.ok) throw new Error(body.error ?? `HTTP ${res.status}`);
  return body;
}

// ── deck upload → pre-read ──────────────────────────────────────────────────
async function runPreRead(filename, data) {
  setBusy(true); showError(null);
  $('deckname').textContent = '';
  $('decklabel').textContent = `reading ${filename}…`;
  $('scroll').innerHTML =
    '<p class="empty" style="padding:40px 0;text-align:center">' +
    'The investor is reading your deck<span class="spinner">…</span><br>' +
    '<span style="font-size:11px">Five passes. Takes about a minute.</span></p>';

  try {
    const result = await call('/api/decks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename, data }),
    });
    memoId = result.memoId;
    memo = result.memo;
    $('decklabel').textContent = '↻ deck';
    $('deckname').textContent = filename;
    renderMemoStandalone(memo);
  } catch (error) {
    showError(error.message);
    $('decklabel').textContent = '+ deck';
    $('scroll').innerHTML = '';
  } finally {
    setBusy(false);
  }
}

$('deck').onchange = async (event) => {
  const file = event.target.files?.[0];
  if (!file) return;
  const data = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
  await runPreRead(file.name, data);
};

$('briefbtn').onclick = async () => {
  if (busy) return;
  setBusy(true); showError(null);
  $('briefbtn').textContent = 'loading…';
  try {
    const result = await call('/api/sample-brief');
    briefId = result.briefId;
    $('briefbtn').textContent = `✓ ${result.brief.objectionThemes.length} objections`;
    $('briefbtn').classList.add('on');
  } catch (error) {
    showError(error.message);
    $('briefbtn').textContent = '+ market';
  } finally {
    setBusy(false);
  }
};

$('sample').onclick = async (event) => {
  if (busy) return;
  // Shift-click forces the full ~78s pipeline; a plain click uses the
  // precomputed memo so a live demo doesn't stall.
  if (event.shiftKey) {
    try {
      const sample = await call('/api/sample-deck');
      await runPreRead(sample.filename, sample.data);
    } catch (error) { showError(error.message); }
    return;
  }
  setBusy(true); showError(null);
  try {
    const result = await call('/api/sample-preread');
    memoId = result.memoId;
    memo = result.memo;
    $('decklabel').textContent = '↻ deck';
    $('deckname').textContent = 'sentinel-seed-deck.pdf';
    renderMemoStandalone(memo);
  } catch (error) {
    showError(error.message);
  } finally {
    setBusy(false);
  }
};

$('start').onclick = async () => {
  setBusy(true); showError(null);
  $('scroll').innerHTML = '<p class="empty" style="padding:40px 0;text-align:center">Opening the meeting<span class="spinner">…</span></p>';
  try {
    const view = await call('/api/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ profileId: $('profile').value, memoId, briefId }),
    });
    sessionId = view.id;
    delta = null; probeOutcomes = null;
    $('export').disabled = false;
    $('debrief').disabled = !memoId;
    render(view);
  } catch (error) {
    showError(error.message);
    $('scroll').innerHTML = '';
  } finally {
    setBusy(false);
  }
};

async function send() {
  const answer = $('answer').value.trim();
  if (!answer || busy || !sessionId) return;
  $('answer').value = '';
  appendPending(answer);
  setBusy(true); showError(null);
  try {
    render(await call(`/api/sessions/${sessionId}/answer`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answer }),
    }));
  } catch (error) {
    showError(error.message);
  } finally {
    setBusy(false);
  }
}

$('send').onclick = send;
$('answer').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); }
});
$('export').onclick = () => { if (sessionId) location.href = `/api/sessions/${sessionId}/export`; };

$('debrief').onclick = async () => {
  if (!sessionId || busy) return;
  setBusy(true); showError(null);
  $('debrief').textContent = 'Re-reading…';
  try {
    const result = await call(`/api/sessions/${sessionId}/delta`, { method: 'POST' });
    delta = result.delta;
    probeOutcomes = result.probes;
    render(await call(`/api/sessions/${sessionId}`));
    $('panel').scrollTop = 0;
  } catch (error) {
    showError(error.message);
  } finally {
    $('debrief').textContent = 'Debrief';
    setBusy(false);
  }
};

// ── voice mode ──────────────────────────────────────────────────────────────
let voice = null;
let liveInvestor = '';

function setVoiceStatus(text, orbClass = '') {
  $('vstatus').textContent = text;
  $('orb').className = `orb ${orbClass}`;
}

function appendVoiceTurn(role, text) {
  const cls = role === 'investor' ? 'investor' : 'founder';
  const who = role === 'investor' ? (memo && window.__who ? window.__who : 'Investor') : 'You';
  $('scroll').insertAdjacentHTML(
    'beforeend',
    `<div class="turn ${cls}"><div class="who">${esc(who)}</div><div class="body">${esc(text)}</div></div>`,
  );
  $('scroll').scrollTop = $('scroll').scrollHeight;
}

$('voice').onclick = async () => {
  if (voice) return;
  showError(null);
  $('voice').classList.add('live');
  $('voice').textContent = '● live';
  $('voicebar').classList.add('on');
  $('composer')?.setAttribute('hidden', '');
  $('scroll').innerHTML = '';
  setVoiceStatus('connecting…');

  const { VoiceSession } = await import('/voice.js');
  voice = new VoiceSession({
    profileId: $('profile').value,
    memo,
    onNotice: (n) => {
      switch (n.kind) {
        case 'status':
          if (n.state === 'ready') setVoiceStatus('listening', 'listening');
          if (n.state === 'closed') endVoice();
          break;
        case 'speech':
          setVoiceStatus(n.active ? 'you are speaking' : 'listening', n.active ? 'listening' : '');
          break;
        case 'speaking':
          if (n.active) setVoiceStatus('investor speaking', 'speaking');
          break;
        case 'transcript':
          if (n.final) {
            if (n.role === 'investor') liveInvestor = '';
            appendVoiceTurn(n.role, n.text);
          } else if (n.role === 'investor') {
            liveInvestor += n.text;
          }
          break;
        case 'claim':
          $('scroll').insertAdjacentHTML(
            'beforeend',
            `<div class="annot" style="margin:0 0 14px auto;justify-content:flex-end">
               <span class="chip claim">${esc(n.metric)} = ${esc(n.value)}</span></div>`,
          );
          break;
        case 'finding':
          $('scroll').insertAdjacentHTML(
            'beforeend',
            `<div class="finding ${n.severity}" style="margin:0 0 16px">
               <div class="sum">${esc(n.summary)}</div></div>`,
          );
          break;
        case 'error':
          showError(n.message);
          break;
      }
    },
  });

  try {
    await voice.start();
  } catch (error) {
    showError(`Microphone: ${error.message}`);
    endVoice();
  }
};

function endVoice() {
  voice?.stop();
  voice = null;
  $('voice').classList.remove('live');
  $('voice').textContent = '🎙 Voice';
  $('voicebar').classList.remove('on');
  $('composer')?.removeAttribute('hidden');
  setVoiceStatus('idle');
}

$('endvoice').onclick = endVoice;

// ── auto demo: two agents, no human ─────────────────────────────────────────
let demoSocket = null;
let demoCtx = null;
let demoCursor = 0;
const demoScript = [];

$('demo').onclick = () => {
  if (demoSocket) { demoSocket.close(); return; }
  showError(null);
  demoScript.length = 0;
  $('scroll').innerHTML =
    '<p class="empty" style="padding:30px 0;text-align:center">Two agents warming up<span class="spinner">…</span></p>';
  $('demo').textContent = '■ stop';
  $('demo').classList.add('live');

  demoCtx = new AudioContext({ sampleRate: 24000 });
  demoCursor = 0;

  const url = new URL('/duo', location.href);
  url.protocol = url.protocol === 'https:' ? 'wss:' : 'ws:';
  url.searchParams.set('profile', $('profile').value);
  url.searchParams.set('turns', '6');

  demoSocket = new WebSocket(url);
  demoSocket.binaryType = 'arraybuffer';
  demoSocket.onopen = () => demoSocket.send(JSON.stringify({ memo }));

  demoSocket.onmessage = (e) => {
    if (e.data instanceof ArrayBuffer) { playDemoChunk(e.data); return; }
    const event = JSON.parse(e.data);
    if (event.kind === 'turn') {
      const who = event.speaker === 'investor'
        ? (memo ? 'Investor' : 'Investor')
        : 'Founder (AI)';
      if ($('scroll').querySelector('.empty')) $('scroll').innerHTML = '';
      $('scroll').insertAdjacentHTML('beforeend',
        `<div class="turn ${event.speaker === 'investor' ? 'investor' : 'founder'}">
           <div class="who">${esc(who)}</div><div class="body">${esc(event.text)}</div></div>`);
      demoScript.push(`**${who}:** ${event.text}`);
      $('scroll').scrollTop = $('scroll').scrollHeight;
    } else if (event.kind === 'claim') {
      $('scroll').insertAdjacentHTML('beforeend',
        `<div class="annot" style="margin:0 0 12px auto;justify-content:flex-end">
           <span class="chip claim">${esc(event.metric)} = ${esc(event.value)}</span></div>`);
    } else if (event.kind === 'finding') {
      $('scroll').insertAdjacentHTML('beforeend',
        `<div class="finding ${event.severity}" style="margin:0 0 14px">
           <div class="sum">${esc(event.summary)}</div></div>`);
      demoScript.push(`> *[ledger: ${event.summary}]*`);
    } else if (event.kind === 'error') {
      showError(event.message);
    } else if (event.kind === 'done') {
      offerScript();
    }
  };
  demoSocket.onclose = () => {
    demoSocket = null;
    $('demo').textContent = '▶ Auto demo';
    $('demo').classList.remove('live');
    if (demoScript.length) offerScript();
  };
};

function playDemoChunk(arrayBuffer) {
  const pcm = new Int16Array(arrayBuffer);
  if (!pcm.length || !demoCtx) return;
  const buffer = demoCtx.createBuffer(1, pcm.length, 24000);
  const channel = buffer.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) channel[i] = pcm[i] / 0x8000;
  const source = demoCtx.createBufferSource();
  source.buffer = buffer;
  source.connect(demoCtx.destination);
  const now = demoCtx.currentTime;
  if (demoCursor < now) demoCursor = now + 0.02;
  source.start(demoCursor);
  demoCursor += buffer.duration;
}

let scriptOffered = false;
function offerScript() {
  if (scriptOffered || !demoScript.length) return;
  scriptOffered = true;
  const blob = new Blob([`# Demo script\n\n${demoScript.join('\n\n')}\n`], { type: 'text/markdown' });
  const href = URL.createObjectURL(blob);
  $('scroll').insertAdjacentHTML('beforeend',
    `<div style="margin:24px 0;text-align:center">
       <a href="${href}" download="demo-script.md"
          style="color:var(--accent);font-size:13px">↓ download script (${demoScript.length} lines)</a>
     </div>`);
  $('scroll').scrollTop = $('scroll').scrollHeight;
  setTimeout(() => { scriptOffered = false; }, 1000);
}
$('barge').onclick = () => voice?.interrupt();

const POSTURE_LABEL = {
  leaning_in: 'Leaning in', neutral: 'Neutral',
  skeptical: 'Skeptical', looking_for_the_no: 'Looking for the no',
};

/** Memo shown on its own after upload, before any session exists. */
function renderMemoStandalone(m) {
  $('scroll').innerHTML = `
    <div style="max-width:64ch">
      <div style="font:600 10px/1 var(--mono);letter-spacing:.14em;color:var(--faint);margin-bottom:14px">
        PRE-READ MEMO · ${m.slideCount} SLIDES
      </div>
      <p style="font-size:13px;color:var(--dim);margin-bottom:18px">
        What the investor thought before you said a word. Pick a profile and start when ready.
        <span style="color:var(--faint)">Shift-click “sample deck” to re-run the full five-pass pre-read live (~80s).</span>
      </p>
      <div style="margin-bottom:18px">
        <span class="posture ${m.initialPosture}">${POSTURE_LABEL[m.initialPosture]}</span>
        <div style="font-size:12px;color:var(--dim);margin-top:8px">${esc(m.postureReason)}</div>
      </div>
      <div class="nocase" style="margin-bottom:20px">${esc(m.caseForNo)}</div>
      <div style="font:600 10px/1 var(--mono);letter-spacing:.14em;color:var(--faint);margin-bottom:10px">
        WHAT THEY'LL ASK YOU
      </div>
      ${m.plannedProbes.map((p) => `
        <div class="probe unasked">
          <span class="mk">${p.priority}</span>
          <span><b>${esc(p.topic)}</b>${p.slideRef ? ` <span style="color:var(--faint)">slide ${p.slideRef}</span>` : ''}
            <div class="qt">“${esc(p.question)}”</div></span>
        </div>`).join('')}
    </div>`;
}

// Optimistic echo so the transcript doesn't stall while the model thinks.
function appendPending(text) {
  const scroll = $('scroll');
  scroll.insertAdjacentHTML('beforeend', `
    <div class="turn founder"><div class="who">You</div><div class="body">${esc(text)}</div></div>
    <div class="turn investor"><div class="who">Investor</div>
      <div class="body" style="color:var(--faint)">thinking<span class="spinner">…</span></div></div>`);
  scroll.scrollTop = scroll.scrollHeight;
}

// ── rendering ───────────────────────────────────────────────────────────────
function render(view) {
  renderConversation(view);
  renderPanel(view);
}

function renderConversation(view) {
  const who = view.profile.persona;
  const html = view.turns.map((t) => {
    if (t.role === 'investor') {
      const label = who
        ? `<img class="face" src="${who.avatar}" alt=""> ${esc(who.shortName)}`
        : 'Investor';
      return `<div class="turn investor">
        <div class="who">${label} ${t.layer ? `<span class="tag ${t.layer}">${t.layer.replace('_', ' ')}</span>` : ''}</div>
        <div class="body">${esc(t.text)}</div>
      </div>`;
    }
    const chips = [];
    if (t.verdict) {
      const v = t.verdict;
      const cls = v.satisfied ? 'good' : v.answered === 'dodged' || v.answered === 'non_answer' ? 'bad' : 'warn';
      chips.push(`<span class="chip ${cls}">${v.answered.replace('_', ' ')} · ${v.specificity.replace('_', ' ')}</span>`);
      if (v.missing) chips.push(`<span class="chip">missing: ${esc(v.missing)}</span>`);
    }
    for (const c of t.claims) {
      chips.push(`<span class="chip claim">${esc(c.metric.replace(/_/g, ' '))} = ${esc(c.valueRaw)}</span>`);
    }
    if (t.roomControl) {
      const cls = t.roomControl.outcome === 'reclaimed' ? 'good' : t.roomControl.outcome === 'partial' ? 'warn' : 'bad';
      chips.push(`<span class="chip ${cls}">room: ${t.roomControl.outcome}</span>`);
    }
    return `<div class="turn founder">
      <div class="who">You</div>
      <div class="body">${esc(t.text)}</div>
      ${chips.length ? `<div class="annot">${chips.join('')}</div>` : ''}
    </div>`;
  }).join('');

  const scroll = $('scroll');
  scroll.innerHTML = html;
  scroll.scrollTop = scroll.scrollHeight;
}

function dial(name, value, max = 1) {
  return `<div class="dial">
    <span class="name">${name}</span>
    <span class="bar"><i style="width:${Math.round((value / max) * 100)}%"></i></span>
    <span class="num">${max === 1 ? value.toFixed(2) : value}</span>
  </div>`;
}

function renderPanel(view) {
  const p = view.profile, m = view.metrics;
  const MARK = { satisfied: '✓', dodged: '✗', asking: '›', unasked: '·' };

  const rate = (v, bad = 0.3) => `<span class="v ${v > bad ? 'bad' : 'good'}">${pct(v)}</span>`;

  $('panel').innerHTML = `
    <section>
      ${p.persona ? `
        <div class="who-card">
          <img src="${p.persona.avatar}" alt="">
          <div>
            <div class="nm">${esc(p.persona.fullName)}</div>
            <div class="rl">${esc(p.persona.title)}, ${esc(p.persona.firm)}<br>${esc(p.persona.location)}</div>
          </div>
        </div>
        <div style="font-size:12px;color:var(--dim);line-height:1.5">${esc(p.persona.bio)}</div>
        <div style="font-size:12px;color:var(--faint);line-height:1.5;margin-top:6px">${esc(p.blurb)}</div>
      ` : `
        <span class="profile-kind ${p.kind}">${p.kind}</span>
        <div style="font-weight:600;margin-bottom:3px">${esc(p.name)}</div>
        <div style="font-size:12px;color:var(--dim);line-height:1.5">${esc(p.blurb)}</div>
      `}
      <div style="margin-top:12px">
        ${dial('warmth', p.dials.warmth)}
        ${dial('derailment', p.dials.derailment)}
        ${dial('self-regard', p.dials.selfRegard)}
        ${dial('follow-ups', p.dials.followUpDepth, 4)}
      </div>
      ${p.persona ? `<div class="disclaimer">${esc(p.persona.disclaimer)}</div>` : ''}
    </section>

    ${delta ? `
    <section>
      <h2>How the meeting moved them</h2>
      <div style="margin-bottom:12px">
        <span class="posture ${delta.initialPosture}">${POSTURE_LABEL[delta.initialPosture]}</span>
        <span style="color:var(--faint);margin:0 6px">${delta.direction > 0 ? '↑' : delta.direction < 0 ? '↓' : '→'}</span>
        <span class="posture ${delta.finalPosture}">${POSTURE_LABEL[delta.finalPosture]}</span>
      </div>
      <div style="font-size:12px;color:var(--dim);line-height:1.5;margin-bottom:14px">${esc(delta.finalPostureReason)}</div>
      ${delta.dimensions.map((d) => `
        <div class="dim-row">
          <span><span class="dot ${d.preRead}">●</span><span style="color:var(--faint)">→</span><span class="dot ${d.postMeeting}">●</span></span>
          <span><b>${esc(d.dimension)}</b><div class="what">${esc(d.whatChanged)}</div></span>
        </div>`).join('')}
      ${delta.fixedInTheRoom.length ? `
        <div style="margin-top:12px"><h2 style="color:var(--green)">Fixed in the room</h2>
        ${delta.fixedInTheRoom.map((x) => `<div class="what" style="margin-bottom:5px">+ ${esc(x)}</div>`).join('')}</div>` : ''}
      ${delta.madeWorse.length ? `
        <div style="margin-top:12px"><h2 style="color:var(--red)">Made worse</h2>
        ${delta.madeWorse.map((x) => `<div class="what" style="margin-bottom:5px">− ${esc(x)}</div>`).join('')}</div>` : ''}
    </section>` : ''}

    ${view.brief ? `
    <section>
      <h2>What this market says (${view.brief.objectionThemes.length})</h2>
      <div style="font-size:11px;color:var(--faint);margin-bottom:10px">
        Mined from ${view.brief.sourceCount} X posts · ${esc(view.brief.category)}
      </div>
      ${view.brief.objectionThemes.slice(0, 5).map((o) => `
        <div class="obj">
          <div class="th">“${esc(o.theme)}”</div>
          <div class="q">→ ${esc(o.investorQuestion)}</div>
          ${o.quotes.slice(0, 1).map((q) => `<div class="src"><a href="${esc(q.url)}" target="_blank" rel="noopener">${esc(q.url.replace('https://x.com/', '@').split('/status')[0])} ↗</a></div>`).join('')}
        </div>`).join('')}
    </section>` : ''}

    ${view.memo ? `
    <section>
      <h2>Pre-read</h2>
      <div style="margin-bottom:10px"><span class="posture ${view.memo.initialPosture}">${POSTURE_LABEL[view.memo.initialPosture]}</span></div>
      <div class="oneliner">
        <div class="lab">SLIDE 1 SAYS</div><div class="q">“${esc(view.memo.oneLinerFromSlide1)}”</div>
      </div>
      <div class="oneliner">
        <div class="lab">THE WHOLE DECK SAYS</div><div class="q">“${esc(view.memo.oneLinerFromFullDeck)}”</div>
      </div>
      <h2 style="margin-top:14px">What bothered them</h2>
      ${view.memo.redFlags.slice(0, 4).map((f) => `
        <div class="flag"><span class="n">${f.rank}</span><span>${esc(f.summary)}</span></div>`).join('')}
      <h2 style="margin-top:14px">The case for passing</h2>
      <div class="nocase">${esc(view.memo.caseForNo)}</div>
      ${probeOutcomes ? `
        <h2 style="margin-top:14px">What they came in wanting to ask</h2>
        ${probeOutcomes.map((p) => `
          <div class="probe ${p.resolved}">
            <span class="mk">${p.resolved === 'satisfied' ? '✓' : p.resolved === 'dodged' ? '✗' : '·'}</span>
            <span>${esc(p.topic)}${p.resolved === 'dodged' ? ' <span style="color:var(--red)">— never answered</span>' : p.resolved === 'unasked' ? ' <span style="color:var(--faint)">— never reached</span>' : ''}</span>
          </div>`).join('')}` : ''}
    </section>` : ''}

    <section class="spine">
      <h2>Coverage</h2>
      <ul>${view.spine.map((t) => `
        <li class="s-${t.state}"><span class="mark">${MARK[t.state]}</span><span class="label">${esc(t.label)}</span></li>
      `).join('')}</ul>
    </section>

    <section>
      <h2>What an investor would catch (${view.findings.length})</h2>
      ${view.findings.length === 0
        ? '<p class="empty">Nothing contradicted itself.</p>'
        : view.findings.map((f) => `
            <div class="finding ${f.severity}">
              <div class="sum">${esc(f.summary)}</div>
              <div class="probe">“${esc(f.probe)}”</div>
            </div>`).join('')}
    </section>

    ${view.roomControl ? `
    <section>
      <h2>Room control</h2>
      ${view.roomControl.judged === 0
        ? '<p class="empty">No derails yet.</p>'
        : `<div class="kv"><span class="k">score</span>
             <span class="v ${view.roomControl.score >= .7 ? 'good' : view.roomControl.score >= .4 ? 'warn' : 'bad'}">${pct(view.roomControl.score)}</span></div>
           <div class="kv"><span class="k">reclaimed / partial / followed</span>
             <span class="v">${view.roomControl.reclaimed} / ${view.roomControl.partial} / ${view.roomControl.followed}</span></div>
           ${view.roomControl.notes.map((n) => `<div class="prov">${esc(n)}</div>`).join('')}`}
    </section>` : ''}

    <section>
      <h2>Claim ledger (${view.ledger.length})</h2>
      ${view.ledger.length === 0
        ? '<p class="empty">No numbers stated yet.</p>'
        : `<table class="ledger">${view.ledger.map((c) => `
            <tr><td class="m">${esc(c.metric.replace(/_/g, ' '))}</td><td class="v">${esc(c.valueRaw)}</td></tr>
          `).join('')}</table>`}
    </section>

    <section>
      <h2>Metrics</h2>
      <div class="kv"><span class="k">non-answer rate</span>${rate(m.nonAnswerRate)}</div>
      <div class="kv"><span class="k">hand-wave rate</span>${rate(m.handWaveRate)}</div>
      <div class="kv"><span class="k">hedges / 100w</span><span class="v">${m.hedgesPer100Words.toFixed(1)}</span></div>
      <div class="kv"><span class="k">avg words / answer</span><span class="v">${m.avgFounderWordsPerTurn}</span></div>
      <div class="kv"><span class="k">talk ratio (you:them)</span><span class="v ${m.talkRatio < 0.8 ? 'warn' : ''}">${m.talkRatio.toFixed(1)}:1</span></div>
    </section>

    <section>
      <h2>Usage</h2>
      <div class="kv"><span class="k">model calls</span><span class="v">${view.usage.calls}</span></div>
      <div class="kv"><span class="k">tokens in / cached</span><span class="v">${view.usage.promptTokens.toLocaleString()} / ${view.usage.cachedTokens.toLocaleString()}</span></div>
      <div class="kv"><span class="k">tokens out</span><span class="v">${view.usage.completionTokens.toLocaleString()}</span></div>
      <div class="kv"><span class="k">est. cost</span><span class="v">$${view.usage.estimatedUsd.toFixed(3)}</span></div>
      <div class="prov">List-rate estimate. The dashboard is authoritative.</div>
    </section>
  `;
}
</script>
</body>
